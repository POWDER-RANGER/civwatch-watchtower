name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      # Non-frozen until lockfile is regenerated after Phase 0 dep adds
      # (pg, node-pg-migrate, @civwatch/* workspace). After `pnpm install`
      # locally and committing pnpm-lock.yaml, switch back to --frozen-lockfile.
      - name: Install dependencies
        run: pnpm install

      - name: Typecheck
        run: pnpm check
